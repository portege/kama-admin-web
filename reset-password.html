<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAMA Admin — Reset Password</title>
  <link rel="stylesheet" href="https://static.babeh.com/admin/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <h1 style="font-size: 72px; font-weight: 400; font-family: 'Boogaloo', cursive; background-image: linear-gradient(135deg, #BB86FC, #9b59f5, #e040fb, #BB86FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 0.3px; margin: 0;">KAMA</h1>
        <p style="margin-top: 10px;">Set a new admin password</p>
      </div>

      <div class="login-error" id="resetError"></div>
      <div class="login-error" id="resetSuccess" style="display:none;background:rgba(46, 204, 113, 0.18);border-color:rgba(46, 204, 113, 0.45);color:#b8ffd8;"></div>

      <form id="resetForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="workspace">Workspace Handle</label>
          <input
            class="form-control"
            type="text"
            id="workspace"
            name="workspace"
            placeholder="e.g. sales-dept"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="retypePassword">Retype New Password</label>
          <input
            class="form-control"
            type="password"
            id="retypePassword"
            name="retypePassword"
            placeholder="Retype new password"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-full" id="resetBtn" style="justify-content:center;margin-top:8px;padding:16px 24px;font-size:15px;font-weight:600;border-radius:10px;letter-spacing:0.02em;">
          Update Password
        </button>
      </form>

      <p style="text-align:center;margin-top:14px;font-size:12px;color:rgba(255,255,255,0.5);">
        Already have credentials? <a href="index.html" style="color:#BB86FC;text-decoration:none;font-weight:600;">Back to login</a>
      </p>

      <p style="text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,0.38);">
        Engineered by <a href="https://mas-mas.it" target="_blank" rel="noopener noreferrer" style="color: #BB86FC; text-decoration: none; font-weight: 600;">Mas-Mas.IT</a>
      </p>
    </div>
  </div>

  <script src="https://static.babeh.com/admin/js/config.js"></script>
  <script>
    const SHARED_ADMIN_API = (() => {
      const hostname = window.location.hostname;
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return 'http://127.0.0.1:8101';
      }
      return 'https://kama-api.babeh.com';
    })();

    function getQueryParam(...keys) {
      const params = new URLSearchParams(window.location.search);
      for (const key of keys) {
        const value = params.get(key);
        if (value && value.trim()) return value.trim();
      }
      return '';
    }

    function showError(message) {
      const errEl = document.getElementById('resetError');
      const okEl = document.getElementById('resetSuccess');
      okEl.style.display = 'none';
      okEl.classList.remove('visible');
      errEl.textContent = message;
      errEl.classList.add('visible');
    }

    function showSuccess(message) {
      const errEl = document.getElementById('resetError');
      const okEl = document.getElementById('resetSuccess');
      errEl.classList.remove('visible');
      okEl.textContent = message;
      okEl.style.display = 'block';
      okEl.classList.add('visible');
    }

    const workspaceFromUrl = getQueryParam('workspace_handle', 'workspace-handle', 'workspace', 'ws', 'workspace_id', 'workspace-id');
    const resetToken = getQueryParam('token', 'reset_token', 'reset-token');

    if (workspaceFromUrl) {
      document.getElementById('workspace').value = workspaceFromUrl;
    }

    if (resetToken) {
      // Keep workspace visible for edits but remove sensitive token from the address bar.
      const clean = new URL(window.location.href);
      clean.searchParams.delete('token');
      clean.searchParams.delete('reset_token');
      clean.searchParams.delete('reset-token');
      window.history.replaceState({}, '', clean.pathname + clean.search);
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('resetBtn');
      const workspace = document.getElementById('workspace').value.trim();
      const password = document.getElementById('password').value;
      const retypePassword = document.getElementById('retypePassword').value;

      document.getElementById('resetError').classList.remove('visible');
      document.getElementById('resetSuccess').classList.remove('visible');

      if (!workspace) {
        showError('Workspace handle is required.');
        return;
      }

      if (!/^[A-Za-z0-9_-]{3,64}$/.test(workspace)) {
        showError('Workspace handle format is invalid.');
        return;
      }

      if (!resetToken) {
        showError('Reset token is missing or invalid. Please use the latest link from your email.');
        return;
      }

      if (resetToken.length < 24) {
        showError('Reset token is too short. Please use a valid reset link.');
        return;
      }

      if (!password || !retypePassword) {
        showError('Please fill in both password fields.');
        return;
      }

      if (password !== retypePassword) {
        showError('Passwords do not match.');
        return;
      }

      if (password.length < 12) {
        showError('Password must be at least 12 characters long.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const res = await fetch(`${SHARED_ADMIN_API}/api/admin/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            workspace,
            token: resetToken,
            new_password: password,
          }),
        });

        let data = {};
        try { data = await res.json(); } catch (_) {}

        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Failed to reset password.');
        }

        showSuccess('Password updated successfully. Redirecting to login…');
        setTimeout(() => {
          window.location.href = `index.html?workspace=${encodeURIComponent(workspace)}`;
        }, 1400);
      } catch (err) {
        showError(err.message || 'Password reset failed.');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
